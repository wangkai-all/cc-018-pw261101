[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parquet-snapshot-studio"
version = "1.0.0"
description = "Immutable parquet snapshots with optimistic compaction and reference-aware GC"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pyarrow>=18,<27",
  "duckdb>=1.1,<3",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
